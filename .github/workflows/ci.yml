name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: for f in scripts/*.sh tests/*.sh; do bash -n "$f"; done

      - name: ShellCheck
        run: shellcheck scripts/dispatch.sh scripts/list-models.sh

      - name: Standalone-skill copies are identical
        run: |
          cmp scripts/dispatch.sh skills/codex-swarm/scripts/dispatch.sh
          cmp scripts/list-models.sh skills/codex-swarm/scripts/list-models.sh

      - name: Model listing and dispatch validation
        run: bash tests/models.sh

      - name: No hard-coded model slugs in skills or scripts
        run: |
          if grep -rnE 'gpt-[0-9]+(\.[0-9]+)?-[a-z]' skills/ agents/ commands/ scripts/; then
            echo "Skills and scripts must take models from the live list, not name them."
            exit 1
          fi

      - name: Manifests are valid JSON
        run: |
          for f in .claude-plugin/*.json .codex-plugin/*.json .agents/plugins/*.json; do
            python3 -m json.tool "$f" > /dev/null && echo "ok  $f"
          done

      - name: Claude plugin tracks commits (no pinned version)
        run: |
          python3 -c 'import json,sys; sys.exit("remove \"version\" from .claude-plugin/plugin.json so users track commits" if "version" in json.load(open(".claude-plugin/plugin.json")) else 0)'
