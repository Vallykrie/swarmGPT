name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: bash -n scripts/dispatch.sh

      - name: ShellCheck
        run: shellcheck scripts/dispatch.sh

      - name: Standalone-skill copies are identical
        run: |
          cmp scripts/dispatch.sh skills/codex-swarm/scripts/dispatch.sh
          cmp scripts/routing.conf skills/codex-swarm/scripts/routing.conf

      - name: Routing table parses
        run: SWARMGPT_ROUTING=scripts/routing.conf bash scripts/dispatch.sh --print-routing

      - name: README lists the current models
        run: |
          for m in $(awk '!/^[[:space:]]*(#|$)/ && NF == 3 { print $2 }' scripts/routing.conf); do
            grep -q "\`$m\`" README.md || { echo "README model table is missing $m"; exit 1; }
          done

      - name: Manifests are valid JSON
        run: |
          for f in .claude-plugin/*.json .codex-plugin/*.json .agents/plugins/*.json; do
            python3 -m json.tool "$f" > /dev/null && echo "ok  $f"
          done

      - name: Claude plugin tracks commits (no pinned version)
        run: |
          python3 -c 'import json,sys; sys.exit("remove \"version\" from .claude-plugin/plugin.json so users track commits" if "version" in json.load(open(".claude-plugin/plugin.json")) else 0)'

      - name: No stale model slugs
        run: |
          if grep -rnE 'gpt-5(\.[0-9]+)?-(sol|luna|astra)' --exclude-dir=.git --exclude=CHANGELOG.md .; then
            echo "Found outdated model slugs; update them to the current routing table."
            exit 1
          fi
