name: Feature request
description: Suggest an improvement to the playbook, routing, or dispatcher
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that SwarmGPT makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Behavior belongs in `skills/*/SKILL.md` or `scripts/dispatch.sh`.
