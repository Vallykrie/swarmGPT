# SwarmGPT model routing table.
#
# dispatch.sh maps the tier named in a subtask's `MODEL:` header to a Codex
# model and reasoning effort using this file. Installed copies refresh it from
# the main branch on GitHub at most once a day, so editing this file and
# pushing re-routes every install without a plugin update.
#
# Format — one entry per line, whitespace-separated:
#   <tier>  <codex model slug>  <reasoning effort>
#   min-codex  <minimum Codex CLI version the models above need>
#
# Keep it to that grammar: dispatch.sh rejects the whole file on any other line.

min-codex  0.158.0

heavy   gpt-6-astra  low
medium  gpt-6-sol    medium
light   gpt-6-luna   max
